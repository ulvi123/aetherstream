spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/tradingStore
    username: postgres
    password: postgres
    pool:
      initial-size: 10
      max-size: 25
      max-idle-time: 15m
  cloud:
    function:
      definition: pricesIn
    stream:
      bindings:
        pricesIn-in-0:
          destination: aether.prices.raw
          content-type: application/json
          group: aether-catalyst
      kafka:
        binder:
          brokers: localhost:9092

